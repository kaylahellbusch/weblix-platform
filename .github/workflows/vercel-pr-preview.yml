name: Vercel PR Preview

on:
  pull_request:
    types:
      - ready_for_review
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Open same-repository PR number to redeploy"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: vercel-pr-preview-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Resolve PR and enforce safety checks
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'pull_request' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository)
      || github.event_name == 'workflow_dispatch'
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}

    steps:
      - name: Resolve PR metadata and enforce safety checks
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER_INPUT: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            pr_number="${{ github.event.pull_request.number }}"
            pr_state="${{ github.event.pull_request.state }}"
            pr_draft="${{ github.event.pull_request.draft }}"
            pr_head_repo="${{ github.event.pull_request.head.repo.full_name }}"
            pr_head_sha="${{ github.event.pull_request.head.sha }}"
          else
            if [[ -z "${PR_NUMBER_INPUT}" ]]; then
              echo "workflow_dispatch requires pr_number input" >&2
              exit 1
            fi

            pr_json="$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER_INPUT}")"

            pr_number="$(jq -r '.number' <<<"${pr_json}")"
            pr_state="$(jq -r '.state' <<<"${pr_json}")"
            pr_draft="$(jq -r '.draft' <<<"${pr_json}")"
            pr_head_repo="$(jq -r '.head.repo.full_name' <<<"${pr_json}")"
            pr_head_sha="$(jq -r '.head.sha' <<<"${pr_json}")"
          fi

          if [[ "${pr_state}" != "open" ]]; then
            echo "PR #${pr_number} is not open." >&2
            exit 1
          fi

          if [[ "${pr_draft}" != "false" ]]; then
            echo "PR #${pr_number} is still draft; preview deploys only run when ready for review." >&2
            exit 1
          fi

          if [[ "${pr_head_repo}" != "${GITHUB_REPOSITORY}" ]]; then
            echo "PR #${pr_number} head repository (${pr_head_repo}) is not ${GITHUB_REPOSITORY}." >&2
            exit 1
          fi

          echo "pr_number=${pr_number}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${pr_head_sha}" >> "${GITHUB_OUTPUT}"

  deploy-preview:
    name: Deploy Vercel preview
    runs-on: ubuntu-latest
    needs: preflight
    environment:
      name: vercel-preview
      url: ${{ steps.deploy.outputs.preview_url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_CLI_VERSION: 64.1.0

    steps:
      - name: Check out PR head commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build preview artifacts with Vercel CLI
        working-directory: .
        run: |
          set -euo pipefail
          npx --yes "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=preview --token "${VERCEL_TOKEN}"
          project_settings_file=".vercel/project.json"
          project_root_directory="unknown"
          if [[ -f "${project_settings_file}" ]]; then
            project_root_directory="$(jq -r '.settings.rootDirectory // .rootDirectory // "."' "${project_settings_file}")"
          fi
          echo "Build step cwd is repository root: $([[ "$(pwd -P)" == "${GITHUB_WORKSPACE}" ]] && echo true || echo false)"
          echo "Pulled project rootDirectory is set: $([[ "${project_root_directory}" != "." && "${project_root_directory}" != "null" && -n "${project_root_directory}" ]] && echo true || echo false)"
          if [[ "${project_root_directory}" != "." && "${project_root_directory}" != "null" && -n "${project_root_directory}" ]]; then
            build_cwd_equals_project_root=false
            if [[ "$(pwd -P)" == "$(realpath -m "${project_root_directory}")" ]]; then
              build_cwd_equals_project_root=true
            fi
            echo "Build cwd equals configured rootDirectory: ${build_cwd_equals_project_root}"
            if [[ "${build_cwd_equals_project_root}" == "true" ]]; then
              echo "Refusing to run vercel build from inside configured rootDirectory; run from repository root." >&2
              exit 1
            fi
          fi

          runner_resolves_npm_before_build=false
          if command -v npm >/dev/null 2>&1; then
            runner_resolves_npm_before_build=true
          fi
          echo "Runner resolves npm before vercel build: ${runner_resolves_npm_before_build}"
          if [[ "${runner_resolves_npm_before_build}" != "true" ]]; then
            echo "npm was not resolvable before invoking vercel build." >&2
            exit 1
          fi

          env_file=".vercel/.env.preview.local"
          if [[ -f "${env_file}" ]]; then
            has_path_entry=false
            if grep -q '^PATH=' "${env_file}"; then
              has_path_entry=true
            fi
            echo "Pulled preview env defines PATH: ${has_path_entry}"
            if [[ "${has_path_entry}" == "true" ]]; then
              tmp_env_file="$(mktemp)"
              awk '!/^PATH=/' "${env_file}" > "${tmp_env_file}"
              {
                echo ""
                echo "PATH=${PATH}"
              } >> "${tmp_env_file}"
              mv "${tmp_env_file}" "${env_file}"

              path_entry_count="$(grep -c '^PATH=' "${env_file}" || true)"
              if [[ "${path_entry_count}" -ne 1 ]]; then
                echo "PATH normalization failed: expected one PATH entry after normalization." >&2
                exit 1
              fi

              normalized_path_matches_runner=false
              if grep -Fxq "PATH=${PATH}" "${env_file}"; then
                normalized_path_matches_runner=true
              fi
              echo "Normalized PATH entry matches runner PATH: ${normalized_path_matches_runner}"
              if [[ "${normalized_path_matches_runner}" != "true" ]]; then
                echo "PATH normalization failed: PATH entry does not match runner PATH." >&2
                exit 1
              fi
            fi
          fi
          npx --yes "vercel@${VERCEL_CLI_VERSION}" build --token "${VERCEL_TOKEN}"

      - name: Deploy preview artifacts
        id: deploy
        working-directory: .
        run: |
          set -euo pipefail
          preview_url="$(npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --token "${VERCEL_TOKEN}")"
          echo "preview_url=${preview_url}" >> "${GITHUB_OUTPUT}"

      - name: Publish deployment summary
        run: |
          {
            echo "## Vercel preview deployed"
            echo ""
            echo "- PR: #${{ needs.preflight.outputs.pr_number }}"
            echo "- Commit: ${{ needs.preflight.outputs.head_sha }}"
            echo "- Preview URL: ${{ steps.deploy.outputs.preview_url }}"
            echo "- Pinned Vercel CLI: ${{ env.VERCEL_CLI_VERSION }}"
          } >> "${GITHUB_STEP_SUMMARY}"

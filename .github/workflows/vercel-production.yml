name: Vercel Production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    name: Resolve main commit and verify CI
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    outputs:
      deploy: ${{ steps.target.outputs.deploy }}
      head_sha: ${{ steps.target.outputs.head_sha }}
    steps:
      - name: Resolve target and enforce release checks
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            target_sha="${CI_HEAD_SHA}"
          else
            target_sha="${main_sha}"
          fi

          if [[ "${target_sha}" != "${main_sha}" ]]; then
            echo "deploy=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Skipping production deployment: target ${target_sha} is no longer the head of main (${main_sha})."
            exit 0
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            successful_ci="$(gh api --paginate --method GET "repos/${GITHUB_REPOSITORY}/actions/runs" \
              -f head_sha="${target_sha}" -f event=push -f status=success -f per_page=100 \
              --jq '.workflow_runs[] | select(.name == "CI" and .conclusion == "success" and .event == "push" and .head_branch == "main") | .id')"
            if [[ -z "${successful_ci}" ]]; then
              echo "::error::Cannot deploy ${target_sha}: no successful CI push run for the current main head."
              exit 1
            fi
          fi

          echo "head_sha=${target_sha}" >> "${GITHUB_OUTPUT}"
          echo "deploy=true" >> "${GITHUB_OUTPUT}"

  deploy:
    name: Deploy Vercel production
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.deploy == 'true'
    # Job-level so skipped runs (PR CI completions) never cancel a release.
    concurrency:
      group: vercel-production
      cancel-in-progress: true
    # Vercel secrets exist only in vercel-preview. Moving them to a production
    # environment is a later owner task.
    environment: vercel-preview
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_CLI_VERSION: 64.1.0
    steps:
      - name: Check out exact target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build production artifacts with Vercel CLI
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        working-directory: .
        run: |
          set -euo pipefail
          npx --yes "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=production --token "${VERCEL_TOKEN}"
          project_settings_file=".vercel/project.json"
          project_root_directory="unknown"
          if [[ -f "${project_settings_file}" ]]; then
            project_root_directory="$(jq -r '.settings.rootDirectory // .rootDirectory // "."' "${project_settings_file}")"
          fi
          echo "Build step cwd is repository root: $([[ "$(pwd -P)" == "${GITHUB_WORKSPACE}" ]] && echo true || echo false)"
          echo "Pulled project rootDirectory is set: $([[ "${project_root_directory}" != "." && "${project_root_directory}" != "null" && -n "${project_root_directory}" ]] && echo true || echo false)"
          if [[ "${project_root_directory}" != "." && "${project_root_directory}" != "null" && -n "${project_root_directory}" ]]; then
            build_cwd_equals_project_root=false
            if [[ "$(pwd -P)" == "$(realpath -m "${project_root_directory}")" ]]; then
              build_cwd_equals_project_root=true
            fi
            echo "Build cwd equals configured rootDirectory: ${build_cwd_equals_project_root}"
            if [[ "${build_cwd_equals_project_root}" == "true" ]]; then
              echo "Refusing to run vercel build from inside configured rootDirectory; run from repository root." >&2
              exit 1
            fi
          fi

          runner_resolves_npm_before_build=false
          if command -v npm >/dev/null 2>&1; then
            runner_resolves_npm_before_build=true
          fi
          echo "Runner resolves npm before vercel build: ${runner_resolves_npm_before_build}"
          if [[ "${runner_resolves_npm_before_build}" != "true" ]]; then
            echo "npm was not resolvable before invoking vercel build." >&2
            exit 1
          fi

          env_file=".vercel/.env.production.local"
          if [[ -f "${env_file}" ]]; then
            has_path_entry=false
            if grep -q '^PATH=' "${env_file}"; then
              has_path_entry=true
            fi
            echo "Pulled production env defines PATH: ${has_path_entry}"
            if [[ "${has_path_entry}" == "true" ]]; then
              tmp_env_file="$(mktemp)"
              awk '!/^PATH=/' "${env_file}" > "${tmp_env_file}"
              {
                echo ""
                echo "PATH=${PATH}"
              } >> "${tmp_env_file}"
              mv "${tmp_env_file}" "${env_file}"

              path_entry_count="$(grep -c '^PATH=' "${env_file}" || true)"
              if [[ "${path_entry_count}" -ne 1 ]]; then
                echo "PATH normalization failed: expected one PATH entry after normalization." >&2
                exit 1
              fi

              normalized_path_matches_runner=false
              if grep -Fxq "PATH=${PATH}" "${env_file}"; then
                normalized_path_matches_runner=true
              fi
              echo "Normalized PATH entry matches runner PATH: ${normalized_path_matches_runner}"
              if [[ "${normalized_path_matches_runner}" != "true" ]]; then
                echo "PATH normalization failed: PATH entry does not match runner PATH." >&2
                exit 1
              fi
            fi
          fi
          npx --yes "vercel@${VERCEL_CLI_VERSION}" build --prod --token "${VERCEL_TOKEN}"

      - name: Deploy production artifacts
        id: deploy
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.preflight.outputs.head_sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [[ "${TARGET_SHA}" != "${main_sha}" ]]; then
            echo "::notice::Skipping production deployment: main advanced while building ${TARGET_SHA}."
            exit 0
          fi
          production_url="$(npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --prod --token "${VERCEL_TOKEN}")"
          echo "production_url=${production_url}" >> "${GITHUB_OUTPUT}"

      - name: Publish deployment summary
        if: steps.deploy.outputs.production_url != ''
        env:
          TARGET_SHA: ${{ needs.preflight.outputs.head_sha }}
          PRODUCTION_URL: ${{ steps.deploy.outputs.production_url }}
        run: |
          {
            echo "## Vercel production deployed"
            echo ""
            echo "- Commit: ${TARGET_SHA}"
            echo "- Production URL: ${PRODUCTION_URL}"
            echo "- Pinned Vercel CLI: ${VERCEL_CLI_VERSION}"
            echo ""
            echo "Deployment success does not prove hosted behavior; complete the hosted checks."
          } >> "${GITHUB_STEP_SUMMARY}"
